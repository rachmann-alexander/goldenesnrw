name: Trinkgut NRW-Biere crawlen

on:
  # Täglich um 4:00 UTC (5:00 MEZ / 6:00 MESZ)
  schedule:
    - cron: "0 4 * * *"

  # Manuell auslösen über GitHub UI
  workflow_dispatch:

  # Bei Push auf main (z.B. nach Konfigurationsänderung)
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - ".github/workflows/crawl.yml"

jobs:
  crawl:
    name: Crawl & Commit biere.json
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Für den Commit

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python aufsetzen ─────────────────────────────────────────────
      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Abhängigkeiten installieren ──────────────────────────────────
      - name: Abhängigkeiten installieren
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # ── 4. Crawler ausführen ────────────────────────────────────────────
      - name: Crawler ausführen
        run: python crawler/crawl_trinkgut.py
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"

      # ── 5. Prüfen ob sich etwas geändert hat ────────────────────────────
      - name: Auf Änderungen prüfen
        id: changes
        run: |
          git diff --quiet data/biere.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      # ── 6. Ergebnisse committen und pushen ──────────────────────────────
      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/biere.json
          DATUM=$(date -u +"%Y-%m-%d %H:%M UTC")
          COUNT=$(python -c "import json; d=json.load(open('data/biere.json')); print(d['count'])")
          git commit -m "🍺 biere.json aktualisiert – ${COUNT} NRW-Biere (${DATUM})"
          git push

      # ── 7. Status-Zusammenfassung ────────────────────────────────────────
      - name: Zusammenfassung
        if: always()
        run: |
          echo "### 🍺 Crawler-Ergebnis" >> $GITHUB_STEP_SUMMARY
          if [ -f data/biere.json ]; then
            COUNT=$(python -c "import json; d=json.load(open('data/biere.json')); print(d['count'])")
            DATUM=$(python -c "import json; d=json.load(open('data/biere.json')); print(d['generated_at'])")
            echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| NRW-Biere gefunden | **${COUNT}** |" >> $GITHUB_STEP_SUMMARY
            echo "| Generiert am | ${DATUM} |" >> $GITHUB_STEP_SUMMARY
            echo "| Geändert | ${{ steps.changes.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ data/biere.json wurde nicht erzeugt" >> $GITHUB_STEP_SUMMARY
          fi
