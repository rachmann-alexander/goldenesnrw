name: Trinkgut NRW-Biere crawlen

on:
  # Täglich um 4:00 UTC (5:00 MEZ / 6:00 MESZ)
  schedule:
    - cron: "0 4 * * *"

  # Manuell auslösen über GitHub UI
  workflow_dispatch:

  # Bei Push auf main (z.B. nach Konfigurationsänderung)
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/crawl.yml"

jobs:
  crawl:
    name: Crawl & Commit biere.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Crawler ausführen
        run: npm run crawl
        timeout-minutes: 15

      - name: Auf Änderungen prüfen
        id: changes
        run: |
          git diff --quiet data/biere.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/biere.json
          DATUM=$(date -u +"%Y-%m-%d %H:%M UTC")
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/biere.json')).count)")
          git commit -m "🍺 biere.json aktualisiert – ${COUNT} NRW-Biere (${DATUM})"
          git push

      - name: Zusammenfassung
        if: always()
        run: |
          echo "### 🍺 Crawler-Ergebnis" >> $GITHUB_STEP_SUMMARY
          if [ -f data/biere.json ]; then
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/biere.json')).count)")
            DATUM=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/biere.json')).generated_at)")
            echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| NRW-Biere gefunden | **${COUNT}** |" >> $GITHUB_STEP_SUMMARY
            echo "| Generiert am | ${DATUM} |" >> $GITHUB_STEP_SUMMARY
            echo "| Geändert | ${{ steps.changes.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ data/biere.json wurde nicht erzeugt" >> $GITHUB_STEP_SUMMARY
          fi
