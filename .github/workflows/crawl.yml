name: marktguru NRW-Bierangebote abrufen

on:
  # Täglich um 4:00 UTC (5:00 MEZ / 6:00 MESZ)
  schedule:
    - cron: "0 4 * * *"

  # Manuell auslösen über GitHub UI
  workflow_dispatch:

  # Bei Push auf main (z.B. nach Konfigurationsänderung)
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - "config.mjs"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/crawl.yml"

jobs:
  fetch:
    name: Angebote abrufen & committen
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Angebote abrufen (marktguru)
        run: npm run fetch:angebote
        timeout-minutes: 15

      - name: Brauereien exportieren
        run: npm run export:brauereien

      - name: Auf Änderungen prüfen
        id: changes
        run: |
          git diff --quiet data/angebote.json data/brauereien.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/angebote.json data/brauereien.json
          DATUM=$(date -u +"%Y-%m-%d %H:%M UTC")
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/angebote.json')).offer_count)")
          BRAU=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/brauereien.json')).count)")
          git commit -m "🍺 Angebote aktualisiert – ${COUNT} Angebote, ${BRAU} Brauereien (${DATUM})"
          git pull --rebase origin main
          git push

      - name: Zusammenfassung
        if: always()
        run: |
          echo "### 🍺 marktguru-Ergebnis" >> $GITHUB_STEP_SUMMARY
          if [ -f data/angebote.json ]; then
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/angebote.json')).offer_count)")
            REGIONS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/angebote.json')).region_count)")
            DATUM=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/angebote.json')).generated_at)")
            echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| Bier-Angebote gesamt | **${COUNT}** |" >> $GITHUB_STEP_SUMMARY
            echo "| NRW-Regionen | ${REGIONS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Generiert am | ${DATUM} |" >> $GITHUB_STEP_SUMMARY
            if [ -f data/brauereien.json ]; then
              BRAU=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/brauereien.json')).count)")
              COORDS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/brauereien.json')).with_coordinates)")
              echo "| Brauereien (Stammhaus) | **${BRAU}** (${COORDS} mit Koordinaten) |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "| Geändert | ${{ steps.changes.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ data/angebote.json wurde nicht erzeugt" >> $GITHUB_STEP_SUMMARY
          fi
